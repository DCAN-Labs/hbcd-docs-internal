site_name: HBCD DCC Docs

use_directory_urls: true

theme:
  name: readthedocs
  collapse_navigation: true
  titles_only: false
  navigation_depth: 4
  features:
    - toc.integrate
    - navigation.expand
    - toc.follow
    - navigation.sections
    - header.autohide
    - content.code.annotate

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.snippets
  - pymdownx.details
  - attr_list
  - admonition
  - md_in_html # markdown used within html blocks can be rendered
  - toc:
      permalink: '🔗'

extra_javascript:
  - js/extra.js
  - https://www.googletagmanager.com/gtag/js?id=G-95CHYYTVHC
  - js/ga.js

extra:
  analytics:
    provider: google
    property: G-95CHYYTVHC

extra_css:
  - css/custom.css
  - css/banners.css
  - css/tables.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css
  - https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css

plugins:
  - search
  - git-revision-date-localized:
      type: date

docs_dir: docs

nav: 
  # - Home: index.md

  - Workgroup Guides:
      - Access Beta Release Data: internal/br-review.md
      - Report Data Issues: internal/reportissues.md
      - Data Release Documentation: internal/readmes.md

  - Beta Releases: 
    - Known Issues: changelog/knownissues.md
    - Release 3.0:    
        - BR 30.2: changelog/versions/BR3X/BR30.2.md
        - BR 30.1: changelog/versions/BR3X/BR30.1.md
        - BR 30.0: changelog/versions/BR3X/BR30.0.md
    - Release Archive: changelog/versions/archive.md
  - Quality Control: 
      - Five Stages of QC: workflows/qc.md
      - MRI Post-Processing QC: workflows/mri/mri-postproc-qc.md
  - Workflows & SOPs:
    - Data Processing: 
          - Overview: workflows/data-proc-wf.md
          - Tabulated Data: workflows/tab-wf.md
          - File-Based Data: workflows/fb-data-proc-wf.md
          - Clinical Data Validation: workflows/clinical-wf.md
          - Genomics: workflows/genomics.md
    - MR Radiology: workflows/mri/mri-issue-wf.md    
    - Data Release SOP: workflows/release-wf.md

  - Standards & Curation:
    - Software & Analytic Standards: standards/software.md
    - Data Curation Procedures: standards/curation.md

  - Resources & Governance: 
      - HDCC Structure: orgcharts.md 
      - HBCD & SCE Governance: resources/hst-sce-governance.md  
      - General Resources: resources/index.md 